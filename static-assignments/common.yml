---
- name: Configure web and NFS servers
  hosts: webservers,nfs
  become: true

  tasks:
    - name: Ensure Wireshark is installed
      ansible.builtin.yum:
        name: wireshark
        state: latest

    - name: Create StegHub directory
      ansible.builtin.file:
        path: /opt/steghub
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Record Ansible configuration completion
      ansible.builtin.lineinfile:
        path: /opt/steghub/info.txt
        line: "Ansible configuration completed on {{ inventory_hostname }}"
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Set timezone to Africa/Lagos
      community.general.timezone:
        name: Africa/Lagos


- name: Configure database server
  hosts: db
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Wireshark is installed
      ansible.builtin.apt:
        name: wireshark
        state: latest

    - name: Create StegHub directory
      ansible.builtin.file:
        path: /opt/steghub
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Record Ansible configuration completion
      ansible.builtin.lineinfile:
        path: /opt/steghub/info.txt
        line: "Ansible configuration completed on {{ inventory_hostname }}"
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Set timezone to Africa/Lagos
      community.general.timezone:
        name: Africa/Lagos


- name: Configure load balancer
  hosts: lb
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Wireshark is installed
      ansible.builtin.apt:
        name: wireshark
        state: latest

    - name: Create StegHub directory
      ansible.builtin.file:
        path: /opt/steghub
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Record Ansible configuration completion
      ansible.builtin.lineinfile:
        path: /opt/steghub/info.txt
        line: "Ansible configuration completed on {{ inventory_hostname }}"
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Set timezone to Africa/Lagos
      community.general.timezone:
        name: Africa/Lagos
