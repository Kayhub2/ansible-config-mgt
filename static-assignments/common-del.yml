---
- name: Remove Wireshark from web and NFS servers
  hosts: webservers,nfs
  become: yes

  tasks:
    - name: Remove Wireshark
      ansible.builtin.yum:
        name: wireshark
        state: absent

- name: Remove Wireshark from database server
  hosts: db
  become: yes

  tasks:
    - name: Remove Wireshark
      ansible.builtin.apt:
        name: wireshark
        state: absent
        autoremove: yes
        purge: yes

- name: Remove Wireshark from load balancer
  hosts: lb
  become: yes

  tasks:
    - name: Remove Wireshark
      ansible.builtin.apt:
        name: wireshark-qt
        state: absent
        autoremove: yes
        purge: yes
