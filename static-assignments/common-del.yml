---
- name: Remove Wireshark from web, NFS and database servers
  hosts: webservers,nfs,db
  remote_user: ec2-user
  become: yes
  become_user: root

  tasks:
    - name: Remove Wireshark
      yum:
        name: wireshark
        state: removed

- name: Remove Wireshark from load balancer
  hosts: lb
  remote_user: ubuntu
  become: yes
  become_user: root

  tasks:
    - name: Remove Wireshark
      apt:
        name: wireshark-qt
        state: absent
        autoremove: yes
        purge: yes
        autoclean: yes