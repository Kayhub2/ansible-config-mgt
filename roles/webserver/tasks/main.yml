---
- name: Install Apache, Git and PHP packages
  become: true
  ansible.builtin.dnf:
    name:
      - httpd
      - git
      - php
      - php-mysqlnd
    state: present
  tags:
    - packages

- name: Ensure source parent directory exists
  become: true
  ansible.builtin.file:
    path: /opt/steghub
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Clone Tooling website repository into a separate source directory
  become: true
  ansible.builtin.git:
    repo: https://github.com/Kayhub2/tooling.git
    dest: /opt/steghub/tooling-source
    version: main
    force: false

- name: Ensure Apache document root exists
  become: true
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: apache
    group: apache
    mode: '0755'

- name: Deploy Tooling website content to Apache document root
  become: true
  ansible.builtin.copy:
    src: /opt/steghub/tooling-source/html/
    dest: /var/www/html/
    remote_src: true
    owner: apache
    group: apache
    directory_mode: '0755'
  notify: Restart Apache

- name: Configure Apache to serve index.php
  become: true
  ansible.builtin.copy:
    dest: /etc/httpd/conf.d/tooling.conf
    content: |
      DirectoryIndex index.php index.html
    owner: root
    group: root
    mode: '0644'
  notify: Restart Apache

- name: Disable the default Apache welcome page
  become: true
  ansible.builtin.file:
    path: /etc/httpd/conf.d/welcome.conf
    state: absent
  notify: Restart Apache

- name: Ensure Apache is started and enabled
  become: true
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true
